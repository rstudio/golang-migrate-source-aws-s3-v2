name: main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    tags: [v*]
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -v -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out
